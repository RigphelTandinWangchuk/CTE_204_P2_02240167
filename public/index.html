<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyDesk — Assignment Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">📚</span>
        <span class="logo-text">StudyDesk</span>
      </div>
      <p class="logo-sub">Assignment Tracker &amp; Deadline Manager</p>
    </div>
  </header>

  <main class="main-layout">

    <!-- ADD ASSIGNMENT FORM -->
    <section class="form-section" aria-labelledby="form-heading">
      <h2 id="form-heading" class="section-title">Add Assignment</h2>

      <form id="assignment-form" novalidate>

        <div class="form-row">
          <div class="form-group">
            <label for="module-name">Module Name</label>
            <input
              type="text"
              id="module-name"
              name="moduleName"
              placeholder="e.g. CTE204 Web Development"
              autocomplete="off"
            />
            <span class="field-error" id="module-name-error" role="alert" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="assignment-title">Assignment Title</label>
            <input
              type="text"
              id="assignment-title"
              name="assignmentTitle"
              placeholder="e.g. Project I — Front-End App"
              autocomplete="off"
            />
            <span class="field-error" id="assignment-title-error" role="alert" aria-live="polite"></span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="due-date">Due Date</label>
            <input
              type="date"
              id="due-date"
              name="dueDate"
            />
            <span class="field-error" id="due-date-error" role="alert" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="">— Select priority —</option>
              <option value="High">High</option>
              <option value="Medium">Medium</option>
              <option value="Low">Low</option>
            </select>
            <span class="field-error" id="priority-error" role="alert" aria-live="polite"></span>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Add Assignment</button>
          <button type="button" class="btn btn-ghost" id="clear-form-btn">Clear</button>
        </div>

      </form>
    </section>

    <!-- WORKLOAD SUMMARY -->
    <section class="summary-section" aria-label="Workload summary">
      <div class="summary-card summary-pending">
        <span class="summary-count" id="count-pending">0</span>
        <span class="summary-label">Pending</span>
      </div>
      <div class="summary-card summary-overdue">
        <span class="summary-count" id="count-overdue">0</span>
        <span class="summary-label">Overdue</span>
      </div>
      <div class="summary-card summary-done">
        <span class="summary-count" id="count-done">0</span>
        <span class="summary-label">Completed</span>
      </div>
    </section>

    <!-- ASSIGNMENT LIST -->
    <section class="list-section" aria-labelledby="list-heading">
      <div class="list-header">
        <h2 id="list-heading" class="section-title">Your Assignments</h2>
        <span class="sort-label">Sorted by due date</span>
      </div>

      <!-- Empty state shown when no assignments exist -->
      <div class="empty-state" id="empty-state">
        <span class="empty-icon">🗂️</span>
        <p>No assignments yet. Add one above to get started.</p>
      </div>

      <!-- Assignment cards are rendered here by JavaScript -->
      <ul class="assignment-list" id="assignment-list" aria-label="Assignment list"></ul>
    </section>

  </main>

  <footer class="site-footer">
    <p>StudyDesk · CTE204 Project I · Data is stored in memory only and resets on page reload.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
